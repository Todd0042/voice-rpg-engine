name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Compile Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 16 KB page size compatibility (Play requirement for targetSdk 35+)
        run: bash scripts/check_16kb.sh app/build/outputs/apk/debug/app-debug.apk

  content-packs:
    name: Engine tests on ${{ matrix.game }} content
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { game: echoes-of-logos, ref: main, private: false }
          - { game: superstore-saga, ref: engine-convergence, private: false }   # main once merged
          - { game: wallys-world, ref: engine-convergence, private: true }   # main once merged
          - { game: commander-america-rpg, ref: engine-convergence, private: true }   # main once merged
    env:
      HAS_TOKEN: ${{ secrets.GAME_REPOS_TOKEN != '' }}
    steps:
      - name: Skip notice (private game, no GAME_REPOS_TOKEN secret)
        if: matrix.private && env.HAS_TOKEN != 'true'
        run: echo "::warning::${{ matrix.game }} is private; add a GAME_REPOS_TOKEN secret (read access to it) to test the engine on its content."

      - name: Checkout engine
        if: ${{ !matrix.private || env.HAS_TOKEN == 'true' }}
        uses: actions/checkout@v4
        with:
          path: voice-rpg-engine

      - name: Checkout ${{ matrix.game }} (content only is used)
        if: ${{ !matrix.private || env.HAS_TOKEN == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: Todd0042/${{ matrix.game }}
          ref: ${{ matrix.ref }}
          path: ${{ matrix.game }}
          token: ${{ matrix.private && secrets.GAME_REPOS_TOKEN || github.token }}

      - name: Set up JDK 17
        if: ${{ !matrix.private || env.HAS_TOKEN == 'true' }}
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: voice-rpg-engine/**/*.gradle*

      - name: Run the engine's tests on the game's content
        if: ${{ !matrix.private || env.HAS_TOKEN == 'true' }}
        working-directory: voice-rpg-engine
        run: chmod +x gradlew scripts/test_content_packs.sh && ./scripts/test_content_packs.sh ${{ matrix.game }}

